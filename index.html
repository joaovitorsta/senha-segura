<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <h2 class="titulo-principal">Gerador de senhas</h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
        </div>
        
        <div class="conteudo-senha">
            <label for="senha">Senha Gerada</label>
            <div class="campo-wrapper">
                <input name="senha" type="text" id="campo-senha" readonly>
            </div>
        </div>
        
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao" id="btn-menos">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao" id="btn-mais">+</button>
                    </div>
                </div>               
                
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Características</h4>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="chk-maiuscula" class="checkbox" checked>
                        <label for="chk-maiuscula">ABC (Maiúsculas)</label>
                    </div>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="chk-minuscula" class="checkbox" checked>
                        <label for="chk-minuscula">abc (Minúsculas)</label>
                    </div>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="chk-numero" class="checkbox" checked>
                        <label for="chk-numero">123 (Números)</label>
                    </div>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="chk-simbolo" class="checkbox">
                        <label for="chk-simbolo">#$& (Símbolos)</label>
                    </div>
                </div>
                
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                    <div class="forca-container">
                        <div class="forca-barra">
                            <div id="indicador-forca"></div>
                        </div>
                        <p id="texto-forca">Média</p>
                    </div>
                </div>

            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
